<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Vision 360 - VR Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- A-Frame Library for VR/WebXR -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        .vr-overlay-ui {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100000;
            pointer-events: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .back-button {
            pointer-events: auto;
            background: rgba(7, 13, 26, 0.8);
            backdrop-filter: blur(8px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            text-decoration: none;
            font-size: 14px;
        }
        .back-button:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }
        .scene-info {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 9999;
            pointer-events: none;
            text-align: center;
        }
        /* Hide A-Frame inspector hint */
        .a-canvas { cursor: grab !important; }
        .a-canvas:active { cursor: grabbing !important; }
    </style>
</head>
<body>
    <!-- UI Overlay -->
    <div class="vr-overlay-ui">
        <button id="ui-exit-btn" class="back-button" style="border:none; outline:none; appearance:none;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Exit VR Mode
        </button>
    </div>

    <div id="scene-title-display" class="scene-info">Loading VR Scene...</div>

    <!-- A-Frame Scene -->
    <a-scene loading-screen="dotsColor: #00f2fe; backgroundColor: #070d1a" renderer="antialias: true; colorManagement: true;">
        <a-assets>
            <img id="panorama-img" src="" crossorigin="anonymous">
        </a-assets>

        <!-- 360 Sky (using flat shader to prevent lighting issues) -->
        <a-sky id="main-sky" 
               radius="5000" 
               rotation="0 -90 0" 
               material="shader: flat; src: #panorama-img; opacity: 1; transparent: true;"
               animation="property: components.material.material.opacity; from: 0; to: 1; dur: 1200; easing: easeOutQuad">
        </a-sky>

        <!-- Exit VR Button inside scene -->
        <a-entity id="exit-vr-btn" class="clickable" 
                  geometry="primitive: plane; width: 1.5; height: 0.4" 
                  material="color: #070d1a; opacity: 0.8; transparent: true; shader: flat" 
                  position="0 1.5 -2" 
                  text="value: EXIT VR; align: center; color: #00f2fe; width: 4; font: mozillavr"
                  animation__mouseenter="property: scale; to: 1.05 1.05 1.05; dur: 200; startEvents: mouseenter"
                  animation__mouseleave="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave">
        </a-entity>

        <!-- Camera and Cursor -->
        <a-entity camera look-controls="reverseMouseDrag: false">
            <a-cursor fuse="true" fuse-timeout="1500" raycaster="objects: .clickable" color="#00f2fe"
                animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1"
                animation__fusing="property: scale; startEvents: fusing; easing: easeInCubic; dur: 1500; from: 1 1 1; to: 0.1 0.1 0.1">
            </a-cursor>
        </a-entity>

        <!-- VR Controllers -->
        <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 100"></a-entity>
        <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 100"></a-entity>
    </a-scene>

    <script>
        // Parse URL Parameters
        const params = new URLSearchParams(window.location.search);
        const imgUrl = params.get('img');
        const title = params.get('title') || '360° View';

        const skyAsset = document.querySelector('#panorama-img');
        const mainSky = document.querySelector('#main-sky');
        const titleDisplay = document.querySelector('#scene-title-display');

        if (imgUrl) {
            titleDisplay.textContent = title;
            
            // 1. Set the source on the asset first
            skyAsset.setAttribute('src', imgUrl);
            
            // 2. Listen for the asset to load
            skyAsset.onload = () => {
                console.log("Texture loaded successfully");
                // Explicitly tell the sky to use the loaded asset
                mainSky.setAttribute('src', '#panorama-img');
            };

            // 3. Handle loading errors
            skyAsset.onerror = () => {
                console.error("Failed to load VR texture:", imgUrl);
                alert('Error loading 360° image for VR. Please check the source.');
                window.history.back();
            };

            // 4. Force immediate source if already cached or for faster initial render attempt
            mainSky.setAttribute('src', imgUrl);
        } else {
            alert('No image found for VR mode.');
            window.history.back();
        }

        // Auto-enter VR mode if supported and requested (optional UX enhancement)
        window.addEventListener('load', () => {
            const scene = document.querySelector('a-scene');
            if (scene.hasLoaded) {
                setupVR();
            } else {
                scene.addEventListener('loaded', setupVR);
            }
        });

        function setupVR() {
            console.log('A-Frame Scene Loaded');
        }

        // ── PHASE 1: Single Source of Truth for Session ─────────
        let xrSession = null;
        let currentMode = 'none'; // 'vr' | 'ar' | 'none'
        let isExitInProgress = false;

        const uiExitBtn = document.querySelector('#ui-exit-btn');
        const sceneLabel = document.querySelector('#exit-btn-label');
        const sceneEl = document.querySelector('a-scene');

        // ── PHASE 2: Labels (No Hardcoding) ─────────────────────
        function updateExitLabel() {
            const labelText = currentMode === 'vr' ? 'Exit VR' : 
                            currentMode === 'ar' ? 'Exit AR' : 'Exit';
            
            if (uiExitBtn) {
                const svg = uiExitBtn.querySelector('svg').outerHTML;
                uiExitBtn.innerHTML = `${svg} ${labelText}`;
            }

            if (sceneLabel) {
                sceneLabel.setAttribute('value', labelText.toUpperCase());
            }
        }

        // ── PHASE 3: Unified Exit (No Engine Mixing) ────────────
        function handleExit() {
            if (isExitInProgress) return;
            
            const session = xrSession || (sceneEl.renderer && sceneEl.renderer.xr.getSession());
            if (!session) return fallbackExit();

            console.log('Exit Triggered. Mode:', currentMode);

            if (currentMode === 'vr') {
                exitVR();
            } else if (currentMode === 'ar') {
                exitAR();
            } else {
                fallbackExit();
            }
        }

        // ── PHASE 4: VR Exit (Three.js only cleanup) ────────────
        function exitVR() {
            isExitInProgress = true;
            const session = xrSession || sceneEl.renderer.xr.getSession();
            if (!session) return fallbackExit();

            session.addEventListener('end', onVREnd, { once: true });
            session.end().catch(() => onVREnd());
        }

        function onVREnd() {
            const renderer = sceneEl.renderer;
            if (renderer) {
                renderer.setAnimationLoop(null);
                renderer.renderLists.dispose();
            }

            // GPU Resource Disposal (Safety Traversal)
            const threeScene = sceneEl.object3D;
            if (threeScene) {
                threeScene.traverse((node) => {
                    if (node.geometry) node.geometry.dispose();
                    if (node.material) {
                        const mats = Array.isArray(node.material) ? node.material : [node.material];
                        mats.forEach(m => {
                            Object.keys(m).forEach(k => { if (m[k] && m[k].isTexture) m[k].dispose(); });
                            m.dispose();
                        });
                    }
                });
            }

            xrSession = null;
            currentMode = 'none';
            updateExitLabel();

            requestAnimationFrame(() => {
                window.location.href = 'index.html';
            });
        }

        // ── PHASE 5: AR Exit (A-Frame Only) ─────────────────────
        function exitAR() {
            isExitInProgress = true;
            if (sceneEl && sceneEl.is('vr-mode')) {
                sceneEl.exitVR(); 
            }
            xrSession = null;
            currentMode = 'none';
            updateExitLabel();
            
            setTimeout(() => { window.location.href = 'index.html'; }, 100);
        }

        // ── PHASE 6: VR Scene Readiness (Fix Black Screen) ──────
        async function initializeVRScene() {
            if (!imgUrl) return;
            
            try {
                // 1. Load texture fully using Three.js Async Loader
                const loader = new THREE.TextureLoader();
                loader.setCrossOrigin('anonymous');
                const tex = await loader.loadAsync(imgUrl);
                
                // 2. Create and configure sky AFTER load
                skyAsset.setAttribute('src', imgUrl);
                mainSky.setAttribute('src', '#panorama-img');
                mainSky.setAttribute('visible', 'true');
                
                console.log('VR Scene Ready: Texture loaded.');
            } catch (err) {
                console.error('Scene Readiness Error:', err);
                mainSky.setAttribute('color', '#111111');
            }
        }

        // ── PHASE 7: Hardware Exit Sync (ESC / Headset Back) ─────
        sceneEl.addEventListener('enter-vr', () => {
            const renderer = sceneEl.renderer;
            xrSession = renderer ? renderer.xr.getSession() : null;
            
            if (xrSession) {
                currentMode = xrSession.mode === 'immersive-vr' ? 'vr' : 
                             xrSession.mode === 'immersive-ar' ? 'ar' : 'none';
                
                xrSession.addEventListener('end', () => {
                    if (!isExitInProgress) {
                        xrSession = null;
                        currentMode = 'none';
                        updateExitLabel();
                    }
                }, { once: true });
            }
            updateExitLabel();
        });

        // ── PHASE 8: Failsafe ───────────────────────────────────
        function fallbackExit() {
            if (sceneEl.renderer) sceneEl.renderer.setAnimationLoop(null);
            xrSession = null;
            currentMode = 'none';
            updateExitLabel();
            setTimeout(() => { window.location.href = 'index.html'; }, 100);
        }

        // Unified Click Binding
        const exitBtn = document.querySelector('#exit-vr-btn');
        if (exitBtn) {
            exitBtn.onclick = null;
            exitBtn.addEventListener('click', () => requestAnimationFrame(handleExit));
        }

        if (uiExitBtn) {
            uiExitBtn.onclick = null;
            uiExitBtn.style.pointerEvents = 'auto';
            uiExitBtn.addEventListener('click', (e) => {
                if (e.cancelable) e.preventDefault();
                requestAnimationFrame(handleExit);
            });
        }

        // Initial readiness check
        initializeVRScene();

        window.addEventListener('beforeunload', () => {
            if (sceneEl.renderer) sceneEl.renderer.setAnimationLoop(null);
        });
    </script>
</body>
</html>
