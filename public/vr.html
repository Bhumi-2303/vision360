<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Vision 360 - VR Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- A-Frame Library for VR/WebXR -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        .vr-overlay-ui {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100000;
            pointer-events: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .back-button {
            pointer-events: auto;
            background: rgba(7, 13, 26, 0.8);
            backdrop-filter: blur(8px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            text-decoration: none;
            font-size: 14px;
        }
        .back-button:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }
        .scene-info {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 9999;
            pointer-events: none;
            text-align: center;
        }
        /* Hide A-Frame inspector hint */
        .a-canvas { cursor: grab !important; }
        .a-canvas:active { cursor: grabbing !important; }
    </style>
</head>
<body>
    <!-- UI Overlay -->
    <div class="vr-overlay-ui">
        <button id="ui-exit-btn" class="back-button" style="border:none; outline:none; appearance:none;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Exit VR Mode
        </button>
    </div>

    <div id="scene-title-display" class="scene-info">Loading VR Scene...</div>

    <!-- A-Frame Scene -->
    <a-scene loading-screen="dotsColor: #00f2fe; backgroundColor: #070d1a" renderer="antialias: true; colorManagement: true;">
        <a-assets>
            <img id="panorama-img" src="" crossorigin="anonymous">
        </a-assets>

        <!-- 360 Sky (using flat shader to prevent lighting issues) -->
        <a-sky id="main-sky" 
               radius="5000" 
               rotation="0 -90 0" 
               material="shader: flat; src: #panorama-img; opacity: 1; transparent: true;"
               animation="property: components.material.material.opacity; from: 0; to: 1; dur: 1200; easing: easeOutQuad">
        </a-sky>

        <!-- Exit VR Button inside scene -->
        <a-entity id="exit-vr-btn" class="clickable" 
                  geometry="primitive: plane; width: 1.5; height: 0.4" 
                  material="color: #070d1a; opacity: 0.8; transparent: true; shader: flat" 
                  position="0 1.5 -2" 
                  text="value: EXIT VR; align: center; color: #00f2fe; width: 4; font: mozillavr"
                  animation__mouseenter="property: scale; to: 1.05 1.05 1.05; dur: 200; startEvents: mouseenter"
                  animation__mouseleave="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave">
        </a-entity>

        <!-- Camera and Cursor -->
        <a-entity camera look-controls="reverseMouseDrag: false">
            <a-cursor fuse="true" fuse-timeout="1500" raycaster="objects: .clickable" color="#00f2fe"
                animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1"
                animation__fusing="property: scale; startEvents: fusing; easing: easeInCubic; dur: 1500; from: 1 1 1; to: 0.1 0.1 0.1">
            </a-cursor>
        </a-entity>

        <!-- VR Controllers -->
        <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 100"></a-entity>
        <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 100"></a-entity>
    </a-scene>

    <script>
        // Parse URL Parameters
        const params = new URLSearchParams(window.location.search);
        const imgUrl = params.get('img');
        const title = params.get('title') || '360° View';

        const skyAsset = document.querySelector('#panorama-img');
        const mainSky = document.querySelector('#main-sky');
        const titleDisplay = document.querySelector('#scene-title-display');

        if (imgUrl) {
            titleDisplay.textContent = title;
            
            // 1. Set the source on the asset first
            skyAsset.setAttribute('src', imgUrl);
            
            // 2. Listen for the asset to load
            skyAsset.onload = () => {
                console.log("Texture loaded successfully");
                // Explicitly tell the sky to use the loaded asset
                mainSky.setAttribute('src', '#panorama-img');
            };

            // 3. Handle loading errors
            skyAsset.onerror = () => {
                console.error("Failed to load VR texture:", imgUrl);
                alert('Error loading 360° image for VR. Please check the source.');
                window.history.back();
            };

            // 4. Force immediate source if already cached or for faster initial render attempt
            mainSky.setAttribute('src', imgUrl);
        } else {
            alert('No image found for VR mode.');
            window.history.back();
        }

        // Auto-enter VR mode if supported and requested (optional UX enhancement)
        window.addEventListener('load', () => {
            const scene = document.querySelector('a-scene');
            if (scene.hasLoaded) {
                setupVR();
            } else {
                scene.addEventListener('loaded', setupVR);
            }
        });

        function setupVR() {
            console.log('A-Frame Scene Loaded');
        }

        // ── Senior Exit VR Controller (Ultra-Robust Pattern) ───────
        let isExitInProgress = false;

        function exitVR() {
            console.log('Exit VR Controller: Initialized');
            if (isExitInProgress) return; 
            isExitInProgress = true;

            const sceneEl = document.querySelector('a-scene');
            if (!sceneEl) { 
                console.error('Exit VR Error: a-scene not found');
                handleFallbackExit();
                return;
            }

            const renderer = sceneEl.renderer;
            const xrSession = renderer ? renderer.xr.getSession() : null;
            
            console.log('Exit VR: Session State ->', xrSession ? 'Active' : 'Null');

            // Failsafe Timeout: If session doesn't end within 500ms, force fallback
            const failsafeTimer = setTimeout(() => {
                if (renderer && renderer.xr.isPresenting) {
                    console.warn('Exit VR Failsafe: XR still presenting after 500ms. Forcing fallback.');
                    handleFallbackExit();
                }
            }, 500);

            if (xrSession) {
                // Validation: Only proceed if session is in a valid state
                if (xrSession.visibilityState === 'hidden') {
                    console.warn('Exit VR: Session already hidden. Forcing cleanup.');
                    clearTimeout(failsafeTimer);
                    handleExitCleanup(sceneEl);
                    return;
                }

                // Async Safe: Wait for hardware to signal the end of immersion
                xrSession.addEventListener('end', () => {
                    console.log('Exit VR: Hardware signaled session end');
                    clearTimeout(failsafeTimer);
                    handleExitCleanup(sceneEl);
                }, { once: true });
                
                xrSession.end().catch(err => {
                    console.error("Exit VR: Session end request rejected ->", err);
                    clearTimeout(failsafeTimer);
                    handleExitCleanup(sceneEl);
                });
            } else {
                clearTimeout(failsafeTimer);
                handleExitCleanup(sceneEl);
            }
        }

        function handleExitCleanup(sceneEl) {
            console.log('Exit VR: Starting GPU Resource Disposal');
            
            // 1. Stop Render Loop Immediately
            if (sceneEl.renderer) {
                sceneEl.renderer.setAnimationLoop(null);
            }

            // 2. Safe GPU Resource Disposal (Full Traversal)
            const threeScene = sceneEl.object3D;
            if (threeScene) {
                threeScene.traverse((node) => {
                    if (node.geometry) node.geometry.dispose();
                    if (node.material) {
                        const materials = Array.isArray(node.material) ? node.material : [node.material];
                        materials.forEach(mat => {
                            Object.keys(mat).forEach(prop => {
                                if (mat[prop] && mat[prop].isTexture) mat[prop].dispose();
                            });
                            mat.dispose();
                        });
                    }
                });
                threeScene.clear();
            }

            // 3. Clear Renderer Pipeline (Safe Reset)
            if (sceneEl.renderer) {
                sceneEl.renderer.renderLists.dispose();
                if (sceneEl.renderer.info) sceneEl.renderer.info.reset();
                // Note: renderer.dispose() removed to ensure context remains reusable
            }

            console.log('Exit VR: Cleanup Complete. Navigating...');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 50);
        }

        function handleFallbackExit() {
            const sceneEl = document.querySelector('a-scene');
            if (sceneEl && sceneEl.renderer) {
                sceneEl.renderer.setAnimationLoop(null);
            }
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 100);
        }

        // Hook into A-Frame's built-in exit event (Triggered by ESC, Controller Back, etc.)
        document.querySelector('a-scene').addEventListener('exit-vr', () => {
            console.log('Exit VR: A-Frame event hook detected');
            exitVR();
        });

        // Exit VR Button Click Logic (In-scene 3D Button)
        const exitBtn = document.querySelector('#exit-vr-btn');
        if (exitBtn) {
            exitBtn.addEventListener('click', (e) => {
                console.log('Exit VR: 3D Button Interaction');
                const scene = document.querySelector('a-scene');
                if (scene.is('vr-mode')) {
                    scene.exitVR(); 
                } else {
                    requestAnimationFrame(() => exitVR());
                }
            });
        }

        // UI Overlay Exit Button Click Logic (2D UI Overlay)
        const uiExitBtn = document.querySelector('#ui-exit-btn');
        if (uiExitBtn) {
            uiExitBtn.style.pointerEvents = 'auto';
            uiExitBtn.addEventListener('click', (e) => {
                console.log('Exit VR: 2D Overlay Interaction');
                if (e.cancelable) e.preventDefault();
                // Defer to next frame to ensure UI response is smooth
                requestAnimationFrame(() => exitVR());
            });
        }

        // Failsafe: Handle abrupt navigation
        window.addEventListener('beforeunload', () => {
            const scene = document.querySelector('a-scene');
            if (scene && scene.renderer) scene.renderer.setAnimationLoop(null);
        });
    </script>
</body>
</html>
