<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Vision 360 - VR Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- A-Frame Library for VR/WebXR -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        .vr-overlay-ui {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100000;
            pointer-events: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .back-button {
            pointer-events: auto;
            background: rgba(7, 13, 26, 0.8);
            backdrop-filter: blur(8px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            text-decoration: none;
            font-size: 14px;
        }
        .back-button:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }
        .scene-info {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 9999;
            pointer-events: none;
            text-align: center;
        }
        /* Hide A-Frame inspector hint */
        .a-canvas { cursor: grab !important; }
        .a-canvas:active { cursor: grabbing !important; }
    </style>
</head>
<body>
    <!-- UI Overlay -->
    <div class="vr-overlay-ui">
        <button id="ui-exit-btn" class="back-button" style="border:none; outline:none; appearance:none;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Exit VR Mode
        </button>
    </div>

    <div id="scene-title-display" class="scene-info">Loading VR Scene...</div>

    <!-- A-Frame Scene -->
    <a-scene loading-screen="dotsColor: #00f2fe; backgroundColor: #070d1a" renderer="antialias: true; colorManagement: true;">
        <a-assets>
            <img id="panorama-img" src="" crossorigin="anonymous">
        </a-assets>

        <!-- 360 Sky (using flat shader to prevent lighting issues) -->
        <a-sky id="main-sky" 
               radius="5000" 
               rotation="0 -90 0" 
               material="shader: flat; src: #panorama-img; opacity: 1; transparent: true;"
               animation="property: components.material.material.opacity; from: 0; to: 1; dur: 1200; easing: easeOutQuad">
        </a-sky>

        <!-- Exit VR Button inside scene -->
        <a-entity id="exit-vr-btn" class="clickable" 
                  geometry="primitive: plane; width: 1.5; height: 0.4" 
                  material="color: #070d1a; opacity: 0.8; transparent: true; shader: flat" 
                  position="0 1.5 -2" 
                  text="value: EXIT VR; align: center; color: #00f2fe; width: 4; font: mozillavr"
                  animation__mouseenter="property: scale; to: 1.05 1.05 1.05; dur: 200; startEvents: mouseenter"
                  animation__mouseleave="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave">
        </a-entity>

        <!-- Camera and Cursor -->
        <a-entity camera look-controls="reverseMouseDrag: false">
            <a-cursor fuse="true" fuse-timeout="1500" raycaster="objects: .clickable" color="#00f2fe"
                animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1"
                animation__fusing="property: scale; startEvents: fusing; easing: easeInCubic; dur: 1500; from: 1 1 1; to: 0.1 0.1 0.1">
            </a-cursor>
        </a-entity>

        <!-- VR Controllers -->
        <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 100"></a-entity>
        <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 100"></a-entity>
    </a-scene>

    <script>
        // Parse URL Parameters
        const params = new URLSearchParams(window.location.search);
        const imgUrl = params.get('img');
        const title = params.get('title') || '360° View';

        const skyAsset = document.querySelector('#panorama-img');
        const mainSky = document.querySelector('#main-sky');
        const titleDisplay = document.querySelector('#scene-title-display');

        if (imgUrl) {
            titleDisplay.textContent = title;
            
            // 1. Set the source on the asset first
            skyAsset.setAttribute('src', imgUrl);
            
            // 2. Listen for the asset to load
            skyAsset.onload = () => {
                console.log("Texture loaded successfully");
                // Explicitly tell the sky to use the loaded asset
                mainSky.setAttribute('src', '#panorama-img');
            };

            // 3. Handle loading errors
            skyAsset.onerror = () => {
                console.error("Failed to load VR texture:", imgUrl);
                alert('Error loading 360° image for VR. Please check the source.');
                window.history.back();
            };

            // 4. Force immediate source if already cached or for faster initial render attempt
            mainSky.setAttribute('src', imgUrl);
        } else {
            alert('No image found for VR mode.');
            window.history.back();
        }

        // Auto-enter VR mode if supported and requested (optional UX enhancement)
        window.addEventListener('load', () => {
            const scene = document.querySelector('a-scene');
            if (scene.hasLoaded) {
                setupVR();
            } else {
                scene.addEventListener('loaded', setupVR);
            }
        });

        function setupVR() {
            console.log('A-Frame Scene Loaded');
        }

        // ── Phase 1: Separate Exit Functions (Strict Engine Isolation) ──
        let isExitInProgress = false;

        function exitAR() {
            const scene = document.querySelector('a-scene');
            console.log('AR Exit: Initializing A-Frame Pipeline');

            try {
                if (scene && scene.is('vr-mode')) {
                    scene.exitVR(); // A-Frame handles XR exit internally
                }
            } catch (e) {
                console.error('AR Exit Error:', e);
            }

            // HARD FAILSAFE: Prevent device lock if engine hangs
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 300);
        }

        function exitVR() {
            const renderer = sceneEl.renderer;
            const session = renderer ? renderer.xr.getSession() : null;

            console.log('VR Exit: Initializing Three.js Pipeline');

            if (!session) {
                fallbackExit();
                return;
            }

            session.addEventListener('end', onVREnd, { once: true });
            session.end().catch(() => onVREnd());
        }

        function onVREnd() {
            const renderer = sceneEl.renderer;
            if (renderer) {
                renderer.setAnimationLoop(null);
                renderer.renderLists.dispose();
            }
            
            // Note: AR cleanup is avoided here to prevent engine conflicts
            console.log('VR Exit: Three.js cleanup complete');
            
            requestAnimationFrame(() => {
                window.location.href = 'index.html';
            });
        }

        // ── Phase 4: Mode Detection ──────────────────────────────
        function isARModeActive() {
            const scene = document.querySelector('a-scene');
            // A-Frame marks AR as 'vr-mode' but we can check specifically for the presence of AR features if needed.
            return scene && scene.is('vr-mode') && !scene.renderer.xr.isPresenting;
        }

        function isVRModeActive() {
            return sceneEl.renderer && sceneEl.renderer.xr && sceneEl.renderer.xr.isPresenting;
        }

        // ── Phase 3: Exit Button Routing ─────────────────────────
        function handleUnifiedExit() {
            if (isExitInProgress) return;
            isExitInProgress = true;
        // ── Phase 1: Persistent Mode Tracking (Hardened Exit) ────
        let lastXRMode = null; // 'ar' or 'vr'

        function getActiveMode() {
            const isVR = sceneEl.renderer && sceneEl.renderer.xr && sceneEl.renderer.xr.isPresenting;
            const isAR = sceneEl && sceneEl.is('vr-mode') && !isVR;

            if (isVR) return 'vr';
            if (isAR) return 'ar';

            return lastXRMode; // Fallback for transition states
        }

        // ── Phase 2: Exit Watchdog (Resilience Layer) ───────────
        function startExitWatchdog() {
            setTimeout(() => {
                const renderer = sceneEl.renderer;
                const stillVR = renderer && renderer.xr && renderer.xr.isPresenting;
                const stillAR = sceneEl && sceneEl.is('vr-mode') && !stillVR;

                if (stillAR || stillVR) {
                    console.warn('XR Exit Hang Detected → Forcing browser recovery');
                    window.location.href = 'index.html';
                }

                // Global safety reset
                lastXRMode = null;
            }, 800); // Allow hardware time to respond first
        }

        // ── Phase 5: Global Hard Escape (Resilient) ──────────────
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                console.log('Global Escape: resilience watchdog started');
                startExitWatchdog();
                
                const mode = getActiveMode();
                if (mode === 'ar') exitAR();
                else if (mode === 'vr') exitVR();
                else fallbackExit();
            }
        });

        // ── Phase 1: Real-time Label Synchronization ────────────
        function updateExitLabel() {
            if (!uiExitBtn) return;
            
            const isVR = sceneEl.renderer && sceneEl.renderer.xr && sceneEl.renderer.xr.isPresenting;
            const isAR = sceneEl && sceneEl.is('vr-mode') && !isVR;

            let labelText = 'EXIT';
            if (isVR) labelText = 'EXIT VR';
            else if (isAR) labelText = 'EXIT AR';

            // Preserve SVG while updating text
            const svg = uiExitBtn.querySelector('svg');
            uiExitBtn.innerHTML = '';
            if (svg) uiExitBtn.appendChild(svg);
            uiExitBtn.appendChild(document.createTextNode(' ' + labelText));

            // Update 3D label if present
            if (sceneLabel) sceneLabel.setAttribute('value', labelText);
            
            console.log('Label Sync:', labelText);
        }

        // Sync state on mode entry
        sceneEl.addEventListener('enter-vr', () => {
            requestAnimationFrame(() => {
                const isVR = sceneEl.renderer && sceneEl.renderer.xr && sceneEl.renderer.xr.isPresenting;
                lastXRMode = isVR ? 'vr' : 'ar';
                console.log('XR Mode Cached:', lastXRMode);
                updateExitLabel();
                
                const session = sceneEl.renderer && sceneEl.renderer.xr.getSession();
                if (session) {
                    session.addEventListener('end', () => {
                        lastXRMode = null;
                        updateExitLabel();
                    }, { once: true });
                }
            });
        });

        sceneEl.addEventListener('exit-vr', () => {
            lastXRMode = null;
            updateExitLabel();
        });

        // ── Phase 3: Exit Button Routing ─────────────────────────
        function handleUnifiedExit() {
            if (isExitInProgress) return;
            isExitInProgress = true;
            
            startExitWatchdog(); // Extra safety

            requestAnimationFrame(() => {
                if (isVRModeActive()) {
                    exitVR();
                } else if (isARModeActive()) {
                    exitAR();
                } else {
                    fallbackExit();
                }
            });
        }

        // ── Phase 6: Failsafe Exit ───────────────────────────────
        function fallbackExit() {
            if (sceneEl.renderer) sceneEl.renderer.setAnimationLoop(null);
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 100);
        }

        // Initial call
        updateExitLabel();

        // ── Scene Initialization & Binding ───────────────────────
        async function initializeVRScene() {
            if (!imgUrl) return;
            try {
                const loader = new THREE.TextureLoader();
                loader.setCrossOrigin('anonymous');
                const tex = await loader.loadAsync(imgUrl);
                
                skyAsset.setAttribute('src', imgUrl);
                mainSky.setAttribute('src', '#panorama-img');
                mainSky.setAttribute('visible', 'true');
            } catch (err) {
                console.error('Scene Initialization Error:', err);
                mainSky.setAttribute('color', '#111111');
            }
        }

        const exitBtn = document.querySelector('#exit-vr-btn');
        if (exitBtn) {
            exitBtn.onclick = null;
            exitBtn.addEventListener('click', handleUnifiedExit);
        }

        if (uiExitBtn) {
            uiExitBtn.onclick = null;
            uiExitBtn.style.pointerEvents = 'auto';
            uiExitBtn.addEventListener('click', (e) => {
                if (e.cancelable) e.preventDefault();
                handleUnifiedExit();
            });
        }

        initializeVRScene();

        window.addEventListener('beforeunload', () => {
            if (sceneEl.renderer) sceneEl.renderer.setAnimationLoop(null);
        });
    </script>
</body>
</html>
