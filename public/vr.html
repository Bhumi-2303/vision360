<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Vision 360 - VR Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- A-Frame Library for VR/WebXR -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- Puter.js for TTS -->
    <script src="https://js.puter.com/v2/"></script>
    <style>
        .vr-overlay-ui {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100000;
            pointer-events: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .back-button {
            pointer-events: auto;
            background: rgba(7, 13, 26, 0.8);
            backdrop-filter: blur(8px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            text-decoration: none;
            font-size: 14px;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .scene-info {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 9999;
            pointer-events: none;
            text-align: center;
        }

        /* Hide A-Frame inspector hint */
        .a-canvas {
            cursor: grab !important;
        }

        .a-canvas:active {
            cursor: grabbing !important;
        }
    </style>
</head>

<body>
    <!-- UI Overlay -->
    <div class="vr-overlay-ui">
        <button id="ui-exit-btn" class="back-button" style="border:none; outline:none; appearance:none;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Exit AR Mode
        </button>
    </div>

    <div id="scene-title-display" class="scene-info">Loading VR Scene...</div>

    <!-- A-Frame Scene -->
    <a-scene loading-screen="dotsColor: #00f2fe; backgroundColor: #070d1a"
        renderer="antialias: true; colorManagement: true;">
        <a-assets>
            <img id="panorama-img" src="" crossorigin="anonymous">
        </a-assets>

        <!-- 360 Sky (using flat shader to prevent lighting issues) -->
        <a-sky id="main-sky" radius="5000" rotation="0 -90 0"
            material="shader: flat; src: #panorama-img; opacity: 1; transparent: true;"
            animation="property: components.material.material.opacity; from: 0; to: 1; dur: 1200; easing: easeOutQuad">
        </a-sky>

        <!-- Exit VR Button inside scene -->
        <a-entity id="exit-vr-btn" class="clickable" geometry="primitive: plane; width: 1.5; height: 0.4"
            material="color: #070d1a; opacity: 0.8; transparent: true; shader: flat" position="0 1.5 -2"
            text="value: EXIT VR; align: center; color: #00f2fe; width: 4; font: mozillavr"
            animation__mouseenter="property: scale; to: 1.05 1.05 1.05; dur: 200; startEvents: mouseenter"
            animation__mouseleave="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave">
        </a-entity>

        <!-- Camera and Cursor -->
        <a-entity camera look-controls="reverseMouseDrag: false">
            <a-cursor fuse="true" fuse-timeout="1500" raycaster="objects: .clickable" color="#00f2fe"
                animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1"
                animation__fusing="property: scale; startEvents: fusing; easing: easeInCubic; dur: 1500; from: 1 1 1; to: 0.1 0.1 0.1">
            </a-cursor>
        </a-entity>

        <!-- VR Controllers -->
        <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 100"></a-entity>
        <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 100"></a-entity>

        <!-- ERA Audio Entity -->
        <a-entity id="era-audio"></a-entity>
    </a-scene>

    <script>
        // Parse URL Parameters
        const params = new URLSearchParams(window.location.search);
        const imgUrl = params.get('img');
        const title = params.get('title') || '360° View';

        const skyAsset = document.querySelector('#panorama-img');
        const mainSky = document.querySelector('#main-sky');
        const titleDisplay = document.querySelector('#scene-title-display');

        if (imgUrl) {
            titleDisplay.textContent = title;

            // 1. Set the source on the asset first
            skyAsset.setAttribute('src', imgUrl);

            // 2. Listen for the asset to load
            skyAsset.onload = () => {
                console.log("Texture loaded successfully");
                // Explicitly tell the sky to use the loaded asset
                mainSky.setAttribute('src', '#panorama-img');
            };

            // 3. Handle loading errors
            skyAsset.onerror = () => {
                console.error("Failed to load VR texture:", imgUrl);
                alert('Error loading 360° image for VR. Please check the source.');
                window.history.back();
            };

            // 4. Force immediate source if already cached or for faster initial render attempt
            mainSky.setAttribute('src', imgUrl);
        } else {
            alert('No image found for VR mode.');
            window.history.back();
        }

        // Auto-enter VR mode if supported and requested (optional UX enhancement)
        window.addEventListener('load', () => {
            const scene = document.querySelector('a-scene');
            if (scene.hasLoaded) {
                setupVR();
            } else {
                scene.addEventListener('loaded', setupVR);
            }
        });

        function setupVR() {
            console.log('A-Frame Scene Loaded');
        }

        // ── ERA Virtual Assistant (Puter TTS) ────────────────────
        async function speakERA() {
            const text = "Hello, I am ERA, your virtual tour assistant. Welcome to R N G P I T.";
            console.log("ERA speaking:", text);

            try {
                // Call Puter TTS
                const ttsResult = await puter.ai.txt2speech(text);
                
                let audioUrl;
                if (typeof ttsResult === 'string') {
                    audioUrl = ttsResult;
                } else if (ttsResult instanceof Blob) {
                    audioUrl = URL.createObjectURL(ttsResult);
                } else if (ttsResult.src) {
                    audioUrl = ttsResult.src; // In case it returns an Audio element
                } else {
                    console.error("Unknown Puter TTS response format:", ttsResult);
                    return;
                }
                
                // Prevent caching by appending timestamp
                audioUrl += "?t=" + Date.now();
                
                const audioEntity = document.querySelector('#era-audio');
                if (audioEntity) {
                    // Stop any currently playing sound and clear previous source
                    if (audioEntity.components.sound) {
                        audioEntity.components.sound.stopSound();
                    }
                    audioEntity.removeAttribute('sound'); 
                    
                    // Play new audio
                    audioEntity.setAttribute('sound', `src: ${audioUrl}; autoplay: true; positional: false`);
                }
            } catch (error) {
                console.error("ERA TTS Failed:", error);
                // Safe fallback could be implemented here
            }
        }

        // Trigger ERA on first user interaction with the scene
        window.addEventListener('click', () => {
            if (!window.eraHasSpoken) {
                window.eraHasSpoken = true;
                speakERA();
            }
        });

        const sceneEl = document.querySelector('a-scene');
        const uiExitBtn = document.querySelector('#ui-exit-btn');
        const sceneLabel = document.querySelector('#exit-btn-label');

        // ── Deterministic Exit Flow (Single Pass) ────────────────
        function handleExit() {
            const renderer = sceneEl ? sceneEl.renderer : null;
            const isVR = renderer && renderer.xr && renderer.xr.isPresenting;
            const isAR = sceneEl && sceneEl.is('vr-mode') && !isVR;

            console.log('Exit Triggered. Mode detected:', isVR ? 'VR' : isAR ? 'AR' : 'None');

            if (isVR) {
                exitVR();
            } else if (isAR) {
                exitAR();
            } else {
                fallbackExit();
            }
        }

        function exitAR() {
            try {
                if (sceneEl && sceneEl.is('vr-mode')) {
                    sceneEl.exitVR(); // A-Frame handles AR exit internally
                }
            } catch (e) {
                console.error('AR Exit Error:', e);
                fallbackExit();
            }
        }

        function exitVR() {
            const renderer = sceneEl.renderer;
            const session = renderer ? renderer.xr.getSession() : null;

            if (session) {
                session.end().catch(fallbackExit);
            } else {
                fallbackExit();
            }
        }

        function fallbackExit() {
            window.location.href = 'index.html';
        }

        // ── Dynamic Labels ──────────────────────────────────────
        function updateExitLabel() {
            if (!uiExitBtn) return;

            const isVR = sceneEl.renderer && sceneEl.renderer.xr && sceneEl.renderer.xr.isPresenting;
            const isAR = sceneEl && sceneEl.is('vr-mode') && !isVR;

            let labelText = isVR ? 'EXIT VR' : isAR ? 'EXIT AR' : 'EXIT';

            const svg = uiExitBtn.querySelector('svg');
            uiExitBtn.innerHTML = '';
            if (svg) uiExitBtn.appendChild(svg);
            uiExitBtn.appendChild(document.createTextNode(' ' + labelText));

            if (sceneLabel) sceneLabel.setAttribute('value', labelText);
        }

        // ── Event Synchronization ───────────────────────────────
        sceneEl.addEventListener('enter-vr', () => {
            requestAnimationFrame(updateExitLabel);

            const session = sceneEl.renderer && sceneEl.renderer.xr.getSession();
            if (session) {
                session.addEventListener('end', () => {
                    requestAnimationFrame(() => {
                        updateExitLabel();
                        window.location.href = 'index.html';
                    });
                }, { once: true });
            }
        });

        sceneEl.addEventListener('exit-vr', updateExitLabel);

        // ── Global Escape & Bindings ────────────────────────────
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') handleExit();
        });

        const exitBtn = document.querySelector('#exit-vr-btn');
        if (exitBtn) {
            exitBtn.onclick = null;
            exitBtn.addEventListener('click', handleExit);
        }

        if (uiExitBtn) {
            uiExitBtn.onclick = null;
            uiExitBtn.style.pointerEvents = 'auto';
            uiExitBtn.addEventListener('click', (e) => {
                if (e.cancelable) e.preventDefault();
                handleExit();
            });
        }

        // ── Scene Initialization ────────────────────────────────
        async function initializeVRScene() {
            if (!imgUrl) return;
            try {
                const loader = new THREE.TextureLoader();
                loader.setCrossOrigin('anonymous');
                const tex = await loader.loadAsync(imgUrl);

                skyAsset.setAttribute('src', imgUrl);
                mainSky.setAttribute('src', '#panorama-img');
                mainSky.setAttribute('visible', 'true');
                updateExitLabel();
            } catch (err) {
                console.error('Scene Initialization Error:', err);
                mainSky.setAttribute('color', '#111111');
            }
        }

        initializeVRScene();

        window.addEventListener('beforeunload', () => {
            if (sceneEl.renderer) sceneEl.renderer.setAnimationLoop(null);
        });
    </script>
</body>

</html>
